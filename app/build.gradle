plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def keystorePropsFile = rootProject.file("keystore.properties")

android {
    namespace 'org.harbor'
    compileSdk 35

    defaultConfig {
        applicationId "org.harbor"
        // 28: the Odin 2 is well above this, but LauncherApps shortcut query
        // (the shortcut passthrough provider) needs 25+, and AudioPlaybackCapture
        // style APIs are not used here, so 28 is a comfortable floor.
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            // Signed only when keystore.properties is present, so the repo
            // still builds for anyone who clones it without the key.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.tv:tv-foundation:1.0.0'
    implementation 'androidx.tv:tv-material:1.1.0'
    implementation 'dev.chrisbanes.haze:haze:1.0.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
